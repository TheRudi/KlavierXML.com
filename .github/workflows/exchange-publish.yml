name: Exchange publish

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: exchange-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      startsWith(github.event.issue.title, 'exchange-upload:') ||
      startsWith(github.event.issue.title, 'exchange-remove:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prefer Pages branch when present
        run: |
          if git ls-remote --exit-code --heads origin cursor/klavierxml-website-4be4 >/dev/null 2>&1; then
            git fetch origin cursor/klavierxml-website-4be4
            git checkout -B cursor/klavierxml-website-4be4 origin/cursor/klavierxml-website-4be4
          fi

      - name: Process exchange issue
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const title = process.env.ISSUE_TITLE || '';
            const body = process.env.ISSUE_BODY || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const master = 'RAL';
            const maxFiles = 100;

            const extractJson = (text) => {
              const match = text.match(/```json\s*([\s\S]*?)```/i);
              if (!match) throw new Error('Missing JSON payload in issue body');
              return JSON.parse(match[1]);
            };

            const readManifest = () => {
              const file = 'exchange/shared-manifest.json';
              if (!fs.existsSync(file)) return { updated: '', scores: [] };
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            };

            const writeManifest = (manifest) => {
              fs.mkdirSync('exchange', { recursive: true });
              fs.writeFileSync(
                'exchange/shared-manifest.json',
                JSON.stringify(manifest, null, 2) + '\n'
              );
            };

            const payload = extractJson(body);

            if (title.startsWith('exchange-upload:')) {
              if (!payload.id || !payload.packageUrl) {
                throw new Error('Upload payload needs id and packageUrl');
              }
              const manifest = readManifest();
              if (manifest.scores.some((s) => s.id === payload.id)) {
                core.info('Score already published');
              } else {
                if (manifest.scores.length >= maxFiles) {
                  throw new Error('Shared exchange is full (100 scores)');
                }
                const res = await fetch(payload.packageUrl);
                if (!res.ok) throw new Error(`Could not fetch package (${res.status})`);
                const pack = await res.json();
                const base64 = pack.contentBase64 || payload.contentBase64;
                if (!base64) throw new Error('Package is missing contentBase64');
                const buffer = Buffer.from(base64, 'base64');
                const rel = `files/${payload.id}.mxl`;
                const out = path.join('exchange', rel);
                fs.mkdirSync(path.dirname(out), { recursive: true });
                fs.writeFileSync(out, buffer);
                const entry = {
                  id: payload.id,
                  title: payload.title || pack.title || 'Untitled score',
                  composer: payload.composer || pack.composer || 'Uploaded score',
                  credit: payload.credit || 'Shared exchange',
                  filename: payload.filename || `${payload.id}.mxl`,
                  format: 'mxl',
                  bytes: payload.bytes || buffer.length,
                  ownerEmailHash: payload.ownerEmailHash || pack.ownerEmailHash || '',
                  added: payload.added || new Date().toISOString().slice(0, 10),
                  file: rel,
                  license:
                    payload.license ||
                    'Uploaded by a community member. Only share files you have rights to distribute.',
                };
                manifest.updated = new Date().toISOString().slice(0, 10);
                manifest.scores = [entry, ...manifest.scores].slice(0, maxFiles);
                writeManifest(manifest);
                core.info(`Published ${entry.id}`);
              }
            } else if (title.startsWith('exchange-remove:')) {
              const manifest = readManifest();
              const item = manifest.scores.find((s) => s.id === payload.id);
              if (!item) {
                core.info('Score not found; nothing to remove');
              } else {
                const secret = String(payload.secret || '').trim();
                const emailHash = crypto
                  .createHash('sha256')
                  .update(secret.toLowerCase())
                  .digest('hex');
                const allowed =
                  secret === master ||
                  (item.ownerEmailHash && emailHash === item.ownerEmailHash);
                if (!allowed) throw new Error('Remove secret did not match');
                if (item.file) {
                  const filePath = path.join('exchange', item.file);
                  if (fs.existsSync(filePath)) fs.unlinkSync(filePath);
                }
                manifest.updated = new Date().toISOString().slice(0, 10);
                manifest.scores = manifest.scores.filter((s) => s.id !== item.id);
                writeManifest(manifest);
                core.info(`Removed ${item.id}`);
              }
            } else {
              core.info('Not an exchange issue');
              return;
            }

            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', [
              'config',
              'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
            ]);
            await exec.exec('git', ['add', 'exchange']);
            const status = await exec.getExecOutput('git', ['status', '--porcelain']);
            if (!status.stdout.trim()) {
              core.info('No exchange changes to commit');
            } else {
              await exec.exec('git', [
                'commit',
                '-m',
                title.startsWith('exchange-remove:')
                  ? `exchange: remove via #${issueNumber}`
                  : `exchange: publish via #${issueNumber}`,
              ]);
              await exec.exec('git', ['push']);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: title.startsWith('exchange-remove:')
                ? 'Removed from the MusicXML exchange.'
                : 'Published to the MusicXML exchange for everyone to download.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
            });
